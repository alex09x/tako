#
# XcodeGen spec for the macOS UI test suite.
#
# SwiftPM has no UI-Testing-Bundle target kind, so swift/Package.swift cannot
# host these tests -- only a real Xcode project can. This project exists for
# exactly that: it wraps the app that scripts/build-macapp.py produces as the
# UI tests' host application.
#
# Regenerate with:  cd macos_uitests && xcodegen generate
name: TakoUITests
options:
  bundleIdPrefix: com.tako-core
  createIntermediateGroups: true
  deploymentTarget:
    macOS: "13.0"
  minimumXcodeGenVersion: "2.38.0"

settings:
  base:
    SWIFT_VERSION: "5.0"
    CODE_SIGN_STYLE: Manual
    CODE_SIGN_IDENTITY: "-"
    DEVELOPMENT_TEAM: ""
    # Our host-app "compile step" shells out to the repo's own build script,
    # which reads and writes all over the repo and the target/ directory.
    ENABLE_USER_SCRIPT_SANDBOXING: NO
    ALWAYS_SEARCH_USER_PATHS: NO

targets:
  # The host application. It has no real sources of its own: the single
  # placeholder file only exists so the native app target has something to
  # link, and the post-build script then replaces the whole product with the
  # real Tako.app that scripts/build-macapp.py builds.
  TakoCore:
    type: application
    platform: macOS
    sources:
      - path: AppHost
    settings:
      base:
        PRODUCT_NAME: TakoCore
        PRODUCT_BUNDLE_IDENTIFIER: com.tako-core.terminal.uitest
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_NSPrincipalClass: NSApplication
        INFOPLIST_KEY_CFBundleDisplayName: TakoCore
        INFOPLIST_KEY_LSApplicationCategoryType: public.app-category.developer-tools
        SKIP_INSTALL: NO
        # The post-build script below replaces this target's entire product
        # with a different, externally-built app bundle (scripts/build-macapp.py's
        # own output), which doesn't have the specific files (e.g. a Debug-
        # configuration helper dylib) Xcode's own automatic CodeSign phase
        # already planned to sign for the placeholder it thinks it built.
        # Xcode's codesign step then fails looking for a file that's gone.
        # Signing this target ourselves, at the end of the same script,
        # after the swap, avoids that mismatch entirely.
        CODE_SIGNING_ALLOWED: NO
    postBuildScripts:
      - name: Build the real app bundle
        basedOnDependencyAnalysis: false
        script: |
          set -uo pipefail
          cd "${SRCROOT}/.."
          if [ -z "${BUILT_PRODUCTS_DIR:-}" ] || [ -z "${FULL_PRODUCT_NAME:-}" ]; then
            echo "error: BUILT_PRODUCTS_DIR/FULL_PRODUCT_NAME unset" >&2
            exit 1
          fi
          DEST="${BUILT_PRODUCTS_DIR}/${FULL_PRODUCT_NAME}"
          # The build script's own output is indented rather than passed
          # through verbatim: Xcode's log parser turns any bare "error:" line
          # into a build failure, and whether the app build failed is decided
          # below by its exit status, not by grepping its prose.
          if TAKO_BUNDLE_ID=com.tako-core.terminal.uitest TAKO_APP_DIR=target/macapp-uitest python3 scripts/build-macapp.py 2>&1 | sed 's/^/    build-macapp| /' && [ -d "target/macapp-uitest/Tako.app" ]; then
            rm -rf "${DEST}"
            /usr/bin/ditto "target/macapp-uitest/Tako.app" "${DEST}"
            /usr/bin/codesign --force --sign - --timestamp=none "${DEST}"
          else
            # Never run a GUI journey against a placeholder or an older app
            # left by another build when the current candidate failed.
            echo "error: the current Tako UI-test host could not be built. No UI tests will run."
            exit 1
          fi

  TakoUITests:
    type: bundle.ui-testing
    platform: macOS
    sources:
      - path: TakoUITests
    dependencies:
      - target: TakoCore
    preBuildScripts:
      - name: Stage real host app bundle
        basedOnDependencyAnalysis: false
        script: |
          set -uo pipefail
          DEST="${BUILT_PRODUCTS_DIR}/TakoCore.app"
          SRC="${SRCROOT}/../target/macapp-uitest/Tako.app"
          if [ -d "${DEST}" ] && [ -d "${SRC}" ]; then
            cp -f "${SRC}/Contents/Info.plist" "${DEST}/Contents/Info.plist"
            /usr/libexec/PlistBuddy -c "Set :CFBundleExecutable TakoCore" "${DEST}/Contents/Info.plist" 2>/dev/null || /usr/libexec/PlistBuddy -c "Add :CFBundleExecutable string TakoCore" "${DEST}/Contents/Info.plist"
            rm -f "${DEST}/Contents/MacOS/TakoCore"
            cp -f "${SRC}/Contents/MacOS/Tako" "${DEST}/Contents/MacOS/TakoCore"
            /usr/bin/codesign --force --sign - --timestamp=none "${DEST}"
          fi
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.tako-core.TakoUITests
        CODE_SIGN_ENTITLEMENTS: TakoUITests/TakoUITests.entitlements
        TEST_TARGET_NAME: TakoCore
        GENERATE_INFOPLIST_FILE: YES

schemes:
  # Both schemes execute real tests. Use build-for-testing when only a
  # compilation is wanted; a test invocation must not silently run nothing.
  TakoUITests:
    build:
      targets:
        TakoUITests: all
    test:
      config: Debug
      targets:
        - TakoUITests
    run:
      config: Debug

  # Compatibility name used by scripts/uitest.sh and hosted CI. These tests
  # drive the logged-in desktop and require UI automation authorization.
  TakoUITests-Run:
    build:
      targets:
        TakoUITests: all
    test:
      config: Debug
      environmentVariables:
        IDE_DISABLED_OS_ACTIVITY_DT_MODE: "1"
      targets:
        - TakoUITests
    run:
      config: Debug
