name: RC workspace and sidebar timing diagnosis
on:
  workflow_dispatch:
permissions:
  contents: read
  actions: read
concurrency:
  group: rc-hosted-workspace-sidebar
  cancel-in-progress: false
jobs:
  sample-switches:
    runs-on: macos-26
    timeout-minutes: 20
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          persist-credentials: false
      - name: Prepare the test app from run 44075043801
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh run download 44075043801 --repo alex09x/tako --name native-test-build-acae243de904a01e6d9670f2c1fb563df869ba32-1 --dir target/timing-download
          python3 scripts/diag_timing_app.py target/timing-download/native-prebuilt.tar target/timing-app
      - name: Prepare the hosted desktop and Bash fixture
        run: |
          set -euo pipefail
          sudo /usr/sbin/DevToolsSecurity --enable
          /usr/bin/automationmodetool
          HOMEBREW_NO_AUTO_UPDATE=1 brew install bash
          bash_path="$(brew --prefix bash)/bin/bash"
          "$bash_path" -c '(( BASH_VERSINFO[0] >= 4 ))'
          sudo dscl . -create "/Users/$(id -un)" UserShell "$bash_path"
          test "$(python3 -c 'import os,pwd; print(pwd.getpwuid(os.getuid()).pw_shell)')" = "$bash_path"
          printf 'TAKO_TEST_BASH=%s\n' "$bash_path" >> "$GITHUB_ENV"
      - name: Sample both switch scenarios
        run: |
          set -euo pipefail
          export APP="$PWD/target/timing-app/Tako.app"
          export TAKO_BUNDLE_ID=com.tako-core.terminal.e2e-timing-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}
          export TAKO_E2E_SAMPLE_DIR="$PWD/target/e2e-samples"
          python3 scripts/ci_log.py --log target/ci-logs/timing.log --label timing -- bash scripts/e2e-macapp.sh workspace-journey sidebar-switch-speed
      - name: Collect failed fixture state
        if: failure()
        run: python3 scripts/ci_kept_state.py --logs target/ci-logs --out target/ci-kept-state
      - name: Retain timing evidence
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: rc-workspace-sidebar-timing
          path: |
            target/timing-app/identity.json
            target/tako-e2e.inputs
            target/e2e-samples/
            target/ci-logs/
            target/ci-kept-state/
          if-no-files-found: error
          retention-days: 14
