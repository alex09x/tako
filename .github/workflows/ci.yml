name: RC hosted motion observations
on:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: rc-hosted-motion-diagnosis
  cancel-in-progress: false
jobs:
  focused-motion:
    runs-on: macos-26
    timeout-minutes: 55
    env:
      CARGO_BUILD_JOBS: "2"
      RUST_TEST_THREADS: "2"
      PROD_CODE_LOCAL: "1"
      TAKO_CODESIGN_IDENTITY: "-"
      HOMEBREW_NO_AUTO_UPDATE: "1"
      MITTS_NO_SOURCE_FALLBACK: "1"
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          persist-credentials: false
          fetch-depth: 4
      - name: Record exact base and observation-only diff
        run: |
          set -euo pipefail
          mkdir -p target/motion-diagnosis
          git rev-parse HEAD | tee target/motion-diagnosis/source.txt
          git diff --exit-code e0b4a024d3f0aeb8638727f3ef5a576d5b1daa3a -- swift/Sources src Cargo.toml Cargo.lock Package.swift
          git diff e0b4a024d3f0aeb8638727f3ef5a576d5b1daa3a -- swift/Tests/TakoTests/Motion/MotionOverlayTests.swift swift/Tests/TakoTests/Motion/MotionWiringTests.swift > target/motion-diagnosis/observation.diff
          xcodebuild -version
          swift --version
          sw_vers
      - name: Bootstrap Mitts
        run: |
          set -euo pipefail
          curl -fsSL https://mittsbuild.com/install.sh -o "$RUNNER_TEMP/mitts-install.sh"
          sh -n "$RUNNER_TEMP/mitts-install.sh"
          env -u MITTS_VERSION MITTS_INSTALL_ROOT="$HOME/.local" sh "$RUNNER_TEMP/mitts-install.sh"
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
          "$HOME/.local/bin/mitts" --version
      - name: Prepare Metal compiler
        run: |
          set -euo pipefail
          if ! xcrun --sdk macosx metal -v >/dev/null 2>&1; then
            xcodebuild -downloadComponent MetalToolchain
          fi
          xcrun --sdk macosx metal --version
          xcrun --find metallib
      - name: Run only the failed motion scopes with diagnostics
        run: |
          set -euo pipefail
          export TAKO_MOTION_DIAGNOSTICS="$PWD/target/motion-diagnosis/captures"
          python3 scripts/check_run.py 'swift:ActivityAlertTests|ActivityForegroundProgramTests|theOverviewOpensOnAStillFrameOfFiveCardsThenItsClockStarts|aFileOverlayFadesInOverThePaneAndOut|anOfflineCardHasADashedBorder|aCardInProgressRunsTheCometAndFillsItsArc|aCardsArcShadesRustToEmber|theActiveSessionIsFilledWithoutAnEdgeBar|theTabNumbersShowAfterCommandIsHeld150ms|overviewOffscreenCaptureBenchmarkWith30Panes' 2>&1 | tee target/motion-diagnosis/focused.log
          test -s "$TAKO_MOTION_DIAGNOSTICS/overlay.json"
          test -s "$TAKO_MOTION_DIAGNOSTICS/badges.json"
      - name: Retain diagnosis
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: rc-hosted-motion-diagnosis
          path: |
            target/motion-diagnosis/
            target/check-logs/
          if-no-files-found: error
          retention-days: 14
