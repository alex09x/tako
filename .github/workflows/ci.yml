name: RC hosted motion diagnosis
on:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: rc-hosted-motion-diagnosis
  cancel-in-progress: false
jobs:
  focused-motion:
    runs-on: macos-26
    timeout-minutes: 55
    env:
      CARGO_BUILD_JOBS: "2"
      RUST_TEST_THREADS: "2"
      PROD_CODE_LOCAL: "1"
      TAKO_CODESIGN_IDENTITY: "-"
      HOMEBREW_NO_AUTO_UPDATE: "1"
      MITTS_NO_SOURCE_FALLBACK: "1"
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          persist-credentials: false
      - name: Record source and diagnostic-only patch
        run: |
          set -euo pipefail
          mkdir -p target/motion-diagnosis
          git rev-parse HEAD | tee target/motion-diagnosis/source.txt
          git diff --exit-code ea3dcb37622e3a4001416f0098c12615459af91e -- swift src Cargo.toml Cargo.lock Package.swift
          shasum -a 256 scripts/ci-motion-diagnostics.patch | tee target/motion-diagnosis/patch.sha256
          git apply --check scripts/ci-motion-diagnostics.patch
          git apply scripts/ci-motion-diagnostics.patch
          git diff -- swift/Tests/TakoTests/Motion/MotionClockTests.swift > target/motion-diagnosis/applied.diff
          xcodebuild -version
          swift --version
          sw_vers
      - name: Bootstrap Mitts
        run: |
          set -euo pipefail
          curl -fsSL https://mittsbuild.com/install.sh -o "$RUNNER_TEMP/mitts-install.sh"
          sh -n "$RUNNER_TEMP/mitts-install.sh"
          env -u MITTS_VERSION MITTS_INSTALL_ROOT="$HOME/.local" sh "$RUNNER_TEMP/mitts-install.sh"
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
          "$HOME/.local/bin/mitts" --version
      - name: Prepare Metal compiler
        run: |
          set -euo pipefail
          if ! xcrun --sdk macosx metal -v >/dev/null 2>&1; then
            xcodebuild -downloadComponent MetalToolchain
          fi
          xcrun --sdk macosx metal --version
          xcrun --find metallib
      - name: Run only the failed motion scopes with diagnostics
        run: |
          set -euo pipefail
          python3 scripts/check_run.py 'swift:MotionClockTests|MotionDelayTests|MotionOverlayTests|MotionOverviewCardTests|MotionRenderingTests|MotionSidebarLookTests|MotionWiringTests' 2>&1 | tee target/motion-diagnosis/focused.log
      - name: Retain diagnosis
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: rc-hosted-motion-diagnosis
          path: target/motion-diagnosis/
          if-no-files-found: error
          retention-days: 14
