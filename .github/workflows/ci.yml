name: RC sidebar driver A-B-A
on:
  workflow_dispatch:
permissions:
  contents: read
  actions: read
concurrency:
  group: rc-sidebar-driver-aba
  cancel-in-progress: false
jobs:
  sidebar-aba:
    runs-on: macos-26
    timeout-minutes: 20
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          persist-credentials: false
      - name: Reuse the pinned hosted app (no application build)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh run download 44058890767 --repo alex09x/tako --name rc-sidebar-speed-observation --dir target/sidebar-original
      - name: Enable hosted UI automation
        run: |
          set -euo pipefail
          sudo /usr/sbin/DevToolsSecurity --enable
          /usr/bin/automationmodetool
      - name: Compare A1, B and A2 on one VM, runner and app source
        run: |
          set -euo pipefail
          python3 scripts/ci_log.py --log target/sidebar-aba-console.log --label sidebar-aba -- python3 scripts/diag_sidebar_aba.py target/sidebar-original
      - name: Retain all modes including failed original performance gates
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: rc-sidebar-driver-aba
          path: |
            target/sidebar-aba/*.json
            target/sidebar-aba/*.txt
            target/sidebar-aba/*.log
            target/sidebar-aba/*/*.json
            target/sidebar-aba/*/*.log
            target/sidebar-aba/*/kept-work/
            target/sidebar-aba-console.log
            target/tako-e2e.inputs
          if-no-files-found: error
          retention-days: 14
