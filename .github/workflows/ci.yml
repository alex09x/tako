name: Tako 0.2.1 unsigned candidate
# The release coordinator exposes this branch only after all 15 node stages
# pass on SOURCE_SHA. A candidate artifact is independent of hosted CI approval.
on:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: tako-021-unsigned-8b2357ce
  cancel-in-progress: false
jobs:
  build:
    if: github.event.repository.private == false
    runs-on: macos-26
    timeout-minutes: 60
    env:
      SOURCE_SHA: 8b2357cef6dc396332fa9f5cbfc5070d2365393a
      TAKO_VERSION: 0.2.1
      TAKO_BUILD_NUMBER: '851'
      TAKO_CODESIGN_IDENTITY: '-'
      TAKO_WITH_ZMX: '1'
      RELEASE: '1'
      PROD_CODE_LOCAL: '1'
      CARGO_BUILD_JOBS: '2'
      HOMEBREW_NO_AUTO_UPDATE: '1'
      MITTS_NO_SOURCE_FALLBACK: '1'
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: ${{ env.SOURCE_SHA }}
          persist-credentials: false
      - name: Verify source and prepare the compiler
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$SOURCE_SHA"
          test "$(uname -m)" = arm64
          test -z "$(git status --porcelain)"
          tools="$RUNNER_TEMP/tako-tools"
          mkdir -p "$tools"
          archive="$tools/mitts-v0.5.3-aarch64-apple-darwin.tar.gz"
          curl -fsSL --connect-timeout 20 --max-time 180 \
            https://github.com/alex09x/mitts/releases/download/v0.5.3/mitts-v0.5.3-aarch64-apple-darwin.tar.gz \
            -o "$archive"
          printf '%s  %s\n' 190a5d3b87eea45859523526c684bc5dba9452ad8e8c83c8597874ca90c285ff "$archive" | shasum -a 256 -c -
          tar -xzf "$archive" -C "$tools" mitts
          echo "$tools" >> "$GITHUB_PATH"
          if ! xcrun --sdk macosx metal -v >/dev/null 2>&1; then
            xcodebuild -downloadComponent MetalToolchain
          fi
      - name: Build and verify the unsigned candidate
        run: |
          set -euo pipefail
          mkdir -p target/rc-candidate
          {
            sw_vers
            xcodebuild -version
            swiftc --version
            rustc --version
            mitts --version
            git rev-parse 'HEAD^{tree}'
          } > target/rc-candidate/toolchain.txt
          python3 scripts/ci_log.py --log target/rc-candidate/build.log --label rc-build -- python3 scripts/build-macapp.py
          ditto -c -k --keepParent target/macapp/Tako.app target/rc-candidate/Tako-0.2.1-unsigned.zip
          staging="$(mktemp -d "$RUNNER_TEMP/tako-candidate.XXXXXX")"
          ditto -x -k target/rc-candidate/Tako-0.2.1-unsigned.zip "$staging"
          codesign --verify --strict --deep "$staging/Tako.app"
          python3 - "$staging/Tako.app" <<'PY'
          import hashlib, json, os, plistlib, sys
          from pathlib import Path
          out = Path("target/rc-candidate")
          app = Path(sys.argv[1])
          info = plistlib.loads((app / "Contents/Info.plist").read_bytes())
          source, version, build = (os.environ[k] for k in ("SOURCE_SHA", "TAKO_VERSION", "TAKO_BUILD_NUMBER"))
          if (info["TakoSourceCommit"], info["CFBundleShortVersionString"], info["CFBundleVersion"]) != (source, version, build):
              raise SystemExit("candidate identity differs from the requested source, version or build")
          if info["CFBundleIdentifier"] != "com.tako-core.terminal":
              raise SystemExit("candidate has a fixture identifier")
          archive = out / "Tako-0.2.1-unsigned.zip"
          with archive.open("rb") as f:
              sha = hashlib.file_digest(f, "sha256").hexdigest()
          data = {"source_sha": source, "version": version, "build": build, "archive": archive.name,
                  "sha256": sha, "distribution_signed": False,
                  "run_url": f"https://github.com/{os.environ['GITHUB_REPOSITORY']}/actions/runs/{os.environ['GITHUB_RUN_ID']}"}
          (out / "candidate.json").write_text(json.dumps(data, indent=2) + "\n")
          (out / "SHA256SUMS").write_text(f"{sha}  {archive.name}\n")
          PY
      - name: Upload the verified unsigned candidate
        if: success()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: tako-0.2.1-unsigned-8b2357ce-attempt-${{ github.run_attempt }}
          path: |
            target/rc-candidate/Tako-0.2.1-unsigned.zip
            target/rc-candidate/candidate.json
            target/rc-candidate/SHA256SUMS
            target/rc-candidate/build.log
            target/rc-candidate/toolchain.txt
          if-no-files-found: error
          retention-days: 7
      - name: Retain build diagnostics on failure
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: tako-0.2.1-build-failure-attempt-${{ github.run_attempt }}
          path: |
            target/rc-candidate/build.log
            target/rc-candidate/toolchain.txt
          if-no-files-found: warn
          retention-days: 7
