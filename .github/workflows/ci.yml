name: Tako 0.2.0-rc.1 unsigned candidate
on:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: tako-rc1-unsigned-5ec0
  cancel-in-progress: false
jobs:
  build:
    if: github.event.repository.private == false
    runs-on: macos-26
    timeout-minutes: 60
    env:
      SOURCE_SHA: 5ec0349c4cb5c62b6d7fb7c03d1601687a0405c2
      TAKO_VERSION: 0.2.0
      TAKO_BUILD_NUMBER: '623'
      TAKO_CODESIGN_IDENTITY: '-'
      TAKO_WITH_ZMX: '1'
      RELEASE: '1'
      PROD_CODE_LOCAL: '1'
      CARGO_BUILD_JOBS: '2'
      HOMEBREW_NO_AUTO_UPDATE: '1'
      MITTS_NO_SOURCE_FALLBACK: '1'
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: ${{ env.SOURCE_SHA }}
          persist-credentials: false
      - name: Verify source and prepare the compiler
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$SOURCE_SHA"
          test "$(uname -m)" = arm64
          test -z "$(git status --porcelain)"
          curl -fsSL https://mittsbuild.com/install.sh -o "$RUNNER_TEMP/mitts-install.sh"
          sh -n "$RUNNER_TEMP/mitts-install.sh"
          env -u MITTS_VERSION MITTS_INSTALL_ROOT="$HOME/.local" sh "$RUNNER_TEMP/mitts-install.sh"
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
          if ! xcrun --sdk macosx metal -v >/dev/null 2>&1; then
            xcodebuild -downloadComponent MetalToolchain
          fi
      - name: Build and verify the unsigned candidate
        run: |
          set -euo pipefail
          mkdir -p target/rc-candidate
          {
            sw_vers
            xcodebuild -version
            swiftc --version
            rustc --version
            mitts --version
            git rev-parse 'HEAD^{tree}'
          } > target/rc-candidate/toolchain.txt
          python3 scripts/ci_log.py --log target/rc-candidate/build.log --label rc-build -- python3 scripts/build-macapp.py
          codesign --verify --strict --deep target/macapp/Tako.app
          ditto -c -k --keepParent target/macapp/Tako.app target/rc-candidate/Tako-0.2.0-unsigned.zip
          python3 - <<'PY'
          import hashlib, json, os, plistlib
          from pathlib import Path
          out = Path("target/rc-candidate")
          app = Path("target/macapp/Tako.app")
          info = plistlib.loads((app / "Contents/Info.plist").read_bytes())
          source, version, build = (os.environ[k] for k in ("SOURCE_SHA", "TAKO_VERSION", "TAKO_BUILD_NUMBER"))
          if (info["TakoSourceCommit"], info["CFBundleShortVersionString"], info["CFBundleVersion"]) != (source, version, build):
              raise SystemExit("candidate identity differs from the requested source, version or build")
          if info["CFBundleIdentifier"] != "com.tako-core.terminal":
              raise SystemExit("candidate has a fixture identifier")
          archive = out / "Tako-0.2.0-unsigned.zip"
          with archive.open("rb") as f:
              sha = hashlib.file_digest(f, "sha256").hexdigest()
          data = {"source_sha": source, "version": version, "build": build, "archive": archive.name,
                  "sha256": sha, "distribution_signed": False,
                  "run_url": f"https://github.com/{os.environ['GITHUB_REPOSITORY']}/actions/runs/{os.environ['GITHUB_RUN_ID']}"}
          (out / "candidate.json").write_text(json.dumps(data, indent=2) + "\n")
          (out / "SHA256SUMS").write_text(f"{sha}  {archive.name}\n")
          PY
      - name: Retain candidate and build evidence
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: tako-0.2.0-rc.1-unsigned-5ec0
          path: target/rc-candidate/
          if-no-files-found: warn
          retention-days: 7
