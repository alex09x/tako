name: macOS CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
    inputs:
      source_ref:
        description: Optional source ref or commit (defaults to the event ref)
        required: false
        type: string
  workflow_call:
    inputs:
      source_ref:
        description: Optional source ref or commit (defaults to the event ref)
        required: false
        type: string

permissions:
  contents: read

concurrency:
  group: hosted-macos-ci-${{ github.workflow }}-${{ github.event_name }}-${{ github.event.pull_request.number || inputs.source_ref || github.ref }}
  cancel-in-progress: true

jobs:
  tests:
    # Standard public-repository arm64 runners only; no LAN or signing keys.
    if: ${{ github.event.repository.visibility == 'public' && github.event.repository.private == false }}
    name: ${{ matrix.stage }} (macOS arm64)
    runs-on: macos-26
    timeout-minutes: 90
    strategy:
      fail-fast: false
      max-parallel: 2
      matrix:
        stage: [engine-tests, cli-tests, python-tests, swift-tests, macapp-tests, ios-unit-tests, macos-ui-tests]
    env:
      CARGO_BUILD_JOBS: "2"
      RUST_TEST_THREADS: "2"
      PROD_CODE_LOCAL: "1"
      TAKO_CODESIGN_IDENTITY: "-"
      HOMEBREW_NO_AUTO_UPDATE: "1"
    defaults:
      run:
        shell: bash
    steps:
      - name: Checkout source
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: ${{ inputs.source_ref || github.ref }}
          persist-credentials: false

      - name: Require standard arm64 macOS and repository toolchain
        run: |
          set -euo pipefail
          test "$(uname -m)" = arm64
          test "$(sw_vers -productVersion | cut -d. -f1)" = 26
          xcode-select --print-path
          xcodebuild -version
          swift --version
          python3 --version
          # rustup reads rust-toolchain.toml, including the three Apple targets.
          rustup show
          cargo --version

      - name: Prepare Metal compiler for Apple targets
        if: ${{ matrix.stage != 'engine-tests' && matrix.stage != 'cli-tests' && matrix.stage != 'python-tests' }}
        run: |
          set -euo pipefail
          if ! xcrun --sdk macosx metal -v >/dev/null 2>&1; then
            echo 'Metal compiler missing; installing the Xcode component'
            xcodebuild -downloadComponent MetalToolchain
          fi
          xcrun --sdk macosx metal --version
          xcrun --find metallib

      - name: Install iOS project generator and show available simulators
        if: ${{ matrix.stage == 'ios-unit-tests' }}
        run: |
          set -euo pipefail
          brew install xcodegen
          xcodegen --version
          xcrun simctl list devices available

      - name: Inspect macOS UI automation
        if: ${{ matrix.stage == 'macos-ui-tests' }}
        run: |
          set -euo pipefail
          sudo /usr/sbin/DevToolsSecurity --enable
          /usr/bin/automationmodetool status

      - name: Run full test-only stage locally
        env:
          CI_STAGE: ${{ matrix.stage }}
        run: ./scripts/ci.sh --local "$CI_STAGE"
